<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07120c" />
    <meta
      name="description"
      content="Armá los equipos del fulbito en treinta segundos: puntuás a los pibes una vez, marcás quién vino y sale el reparto más parejo."
    />

    <!-- Installable. The manifest and the icons live in public/, so these
         hrefs are rewritten with the base path at build time. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Safari still wants the old spelling of that, plus a name for the home
         screen and a status bar that is not white on a dark app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fulbito" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Fulbito — equipos parejos, sin discutir</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
